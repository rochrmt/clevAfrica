# ============================================================
#  CLEV Africa — Stack Docker (site PHP/Apache) avec Traefik
#  Prérequis : Traefik doit tourner sur /opt/traefik/
#  Usage : docker compose up -d --build
#  Accès : https://clev-africa.mbila.pro (SSL automatique)
# ============================================================

services:
  # ── Application (PHP + Apache) ───────────────────────────────────────────
  app:
    build: .
    container_name: clev-africa
    environment:
      # mot de passe admin — le mettre dans un fichier .env (ADMIN_PASSWORD=…)
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-clevadmin}
    volumes:
      - clev-data:/var/www/html/data
      - clev-uploads:/var/www/html/uploads
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - default
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      # Router : domaine de l'app
      - "traefik.http.routers.clev-africa.rule=Host(`clev-africa.mbila.pro`)"
      - "traefik.http.routers.clev-africa.entrypoints=websecure"
      - "traefik.http.routers.clev-africa.tls.certresolver=letsencrypt"
      # Service : port interne de l'app
      - "traefik.http.services.clev-africa.loadbalancer.server.port=80"
      # Middlewares : gzip + sécurité
      - "traefik.http.routers.clev-africa.middlewares=gzip@file,security-headers@file"

volumes:
  clev-data:
  clev-uploads:

networks:
  traefik-proxy:
    name: traefik-proxy
    external: true
